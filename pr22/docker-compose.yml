version: "3.8"

services:
  backend1:
    build: .
    environment:
      PORT: 3000
      INSTANCE_NAME: backend-1
    expose:
      - "3000"

  backend2:
    build: .
    environment:
      PORT: 3000
      INSTANCE_NAME: backend-2
      RESPONSE_DELAY_MS: 250
    expose:
      - "3000"

  backend3:
    build: .
    environment:
      PORT: 3000
      INSTANCE_NAME: backend-backup
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend1
      - backend2
      - backend3
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  haproxy:
    image: haproxy:2.9-alpine
    depends_on:
      - backend1
      - backend2
      - backend3
    ports:
      - "8081:80"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro