version: "3.8"

services:
  backend1:
    build: .
    environment:
      PORT: 3000
      INSTANCE_NAME: backend-1
    expose:
      - "3000"
    networks:
      - app-network

  backend2:
    build: .
    environment:
      PORT: 3001
      INSTANCE_NAME: backend-2
      RESPONSE_DELAY_MS: 250
    expose:
      - "3001"
    networks:
      - app-network

  backend3:
    build: .
    environment:
      PORT: 3002
      INSTANCE_NAME: backend-backup
    expose:
      - "3002"
    networks:
      - app-network

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    networks:
      - app-network

networks:
  app-network:
    driver: bridge